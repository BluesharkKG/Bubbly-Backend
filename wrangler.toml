# For Cloudflare Workers Builds (GitHub/GitLab):
# set Root directory in dashboard to the folder containing this file.
# Workers Builds root-directory is configured in dashboard build settings.
name = "bubble-browser-backend"
main = "src/worker.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]
 
[vars]
# Optional: set BRAVE_API_KEY via wrangler secret for Brave Search
# wrangler secret put BRAVE_API_KEY
 
[[rules]]
type = "ESModule"
globs = ["**/*.ts"]
 
[build]
command = ""
 
# Rate-limit state uses a Durable Object — optional enhancement
# Uncomment to enable persistent rate-limiting across instances:
# [[durable_objects.bindings]]
# name = "RATE_LIMITER"
# class_name = "RateLimiterDO"
 
# [[migrations]]
# tag = "v1"
# new_classes = ["RateLimiterDO"]
